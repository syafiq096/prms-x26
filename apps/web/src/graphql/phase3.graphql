query SystemStatus {
  systemStatus {
    state
  }
}

query MyCrewLeadProfile {
  myCrewLeadProfile {
    id
    missionCode
    fullName
    active
  }
}

query Passengers($filter: PassengerFilter, $page: PageInput) {
  passengers(filter: $filter, page: $page) {
    totalCount
    pageInfo {
      endCursor
      hasNextPage
    }
    edges {
      cursor
      node {
        id
        missionCode
        fullName
        email
        cabinCode
        membershipLevel
        active
        deactivationReason
        version
      }
    }
  }
}

mutation CreatePassenger($input: CreatePassengerInput!) {
  createPassenger(input: $input) {
    passenger {
      id
      missionCode
      fullName
      email
      cabinCode
      membershipLevel
      active
      version
    }
  }
}

mutation UpdatePassenger($input: UpdatePassengerInput!) {
  updatePassenger(input: $input) {
    passenger {
      id
      missionCode
      fullName
      email
      cabinCode
      membershipLevel
      active
      version
    }
  }
}

mutation ChangePassengerMembership(
  $id: ID!
  $membershipLevel: MembershipLevel!
  $expectedVersion: Int!
) {
  changePassengerMembership(
    id: $id
    membershipLevel: $membershipLevel
    expectedVersion: $expectedVersion
  ) {
    passenger {
      id
      membershipLevel
      version
    }
  }
}

mutation DeactivatePassenger(
  $id: ID!
  $reason: String!
  $expectedVersion: Int!
) {
  deactivatePassenger(
    id: $id
    reason: $reason
    expectedVersion: $expectedVersion
  ) {
    passenger {
      id
      active
      deactivationReason
      version
    }
  }
}

