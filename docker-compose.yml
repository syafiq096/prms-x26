services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: prms
      POSTGRES_USER: prms
      POSTGRES_PASSWORD: prms
    ports:
      - '5432:5432'
    volumes:
      - prms-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U prms -d prms']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  prms-postgres:
